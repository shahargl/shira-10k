<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f3">

<body>
  <header class="page-header">

      <p class="kicker">28.10.2026 · מרוץ 10 ק״מ</p>
      <h1>תוכנית האימונים של שירה</h1>

  <footer>
    כאב חד, נפיחות או שינוי בצורת הריצה = עוצרים. התוכנית אינה תחליף לייעוץ רפואי.
  </footer>
  <script type="module" src="./app.js"></script>

</html>
